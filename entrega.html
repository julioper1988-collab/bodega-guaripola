<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Entrega · Guaripola</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f4f5f8">
<link rel="icon" href="icon-192.png">
<style>
/* Página del repartidor: ve el pedido asignado y marca Salí / Entregado */
:root{--bg:#f4f5f8;--text:#202733;--text2:#7b828d;--border:#e8eaf0;--line:#d9dde3;--acc:#ef6a24;--acc2:#d65413;--accbg:#fff3ea;--ok:#2b8a3e;--err:#d63c3c;--sh:0 4px 16px #19263b10;color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:calc(18px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}
a{color:inherit}
.wrap{max-width:520px;margin:0 auto}
.kicker{font-size:12px;text-transform:uppercase;letter-spacing:2px;color:#eb651d;font-weight:800}
h1{font-size:28px;margin-top:4px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.est{font-size:13px;font-weight:800;border-radius:999px;padding:6px 12px;background:#fff;box-shadow:var(--sh)}
.est.en_camino{background:var(--accbg);color:var(--acc2)}.est.entregado{background:#e9f7ec;color:var(--ok)}.est.cancelado{background:#fdecec;color:var(--err)}
.card{background:#fff;border-radius:19px;padding:16px;margin-top:12px;box-shadow:0 2px 10px #19263b08;border:1px solid #edf0f2}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--text2);font-weight:800;margin-bottom:6px}
.big{font-size:19px;font-weight:800}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.b{flex:1 1 40%;display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:13px 10px;font-weight:800;font-size:15px;cursor:pointer;color:var(--text)}
.b.wa{background:#25d366;border-color:#25d366;color:#fff}
.it{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed var(--border)}.it:last-child{border:0}
.cobrar{font-size:26px;font-weight:900;color:var(--acc2)}
.ok{color:var(--ok);font-weight:800}
.small{font-size:13px;color:var(--text2)}
.go{width:100%;border:0;border-radius:16px;padding:18px;font-size:18px;font-weight:900;color:#fff;background:#ed6923;margin-top:14px;cursor:pointer;box-shadow:0 6px 16px #ed692340}
.go.done{background:var(--ok);box-shadow:0 6px 16px #2b8a3e40}
.go:disabled{opacity:.6}
.empty{text-align:center;padding:60px 10px;color:var(--text2)}
.live{background:#e9f7ec;border-color:#cdebd5}.live .b.wa{margin-top:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stats div{background:#fff;border-radius:16px;padding:12px 6px;text-align:center;box-shadow:0 2px 10px #19263b08}.stats b{display:block;font-size:26px}.stats span{font-size:12px;color:var(--text2);font-weight:700}
.dia{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}.dia button{border:1px solid var(--line);background:#fff;border-radius:12px;width:44px;height:40px;font-size:18px;cursor:pointer}
.ped{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--border);text-decoration:none}.ped:last-child{border:0}
.back{display:inline-block;margin-bottom:8px;font-weight:800;color:var(--acc2);text-decoration:none}
.fact{background:var(--accbg);border-radius:12px;padding:10px 12px;margin-top:10px;font-weight:700}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="empty">Cargando pedido…</div></div>
<script>
const SB_URL='https://sdpysvowvwucjfnyosuf.supabase.co';
const SB_KEY='sb_publishable_Px9Uz083rGIy3drTUvlDdw_otNlwCvs';
const QS=new URLSearchParams(location.search),TK=QS.get('t')||'',RK=QS.get('r')||'';
const EST={pendiente:'Pendiente',aceptado:'Aceptado',preparando:'Preparando',en_camino:'🛵 En camino',entregado:'✅ Entregado',cancelado:'❌ Cancelado'};
const PAGO={efectivo:'Efectivo',transferencia:'Transferencia',qr:'QR',tarjeta:'Tarjeta (POS)'};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const gs=n=>'Gs. '+Math.round(Number(n)||0).toLocaleString('es-PY');
const wa=t=>{t=String(t||'').replace(/\D/g,'');return t.startsWith('0')?'595'+t.slice(1):t;};
async function rpc(fn,body){const r=await fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw new Error('Error de conexión ('+r.status+')');return r.json();}
let P=null;
function coords(u){const m=String(u||'').match(/(-?\d{1,3}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)/);return m?[m[1],m[2]]:null;}
// Mensaje para avisar al cliente; la ubicación en tiempo real la comparte el repartidor desde WhatsApp
function avisoTxt(p){const n=String(p.cliente_nombre||'').trim().split(/\s+/)[0];
  return 'Hola '+n+', soy '+(p.repartidor||'el delivery')+' de Guaripola 🛵 Ya salí con tu pedido #'+p.numero+'. Te comparto mi ubicación en tiempo real 👇';}
function render(){
  const p=P,c=coords(p.ubicacion),dest=c?c.join(','):encodeURIComponent(p.direccion||'');
  const cobrar=p.metodo_pago==='efectivo'||p.metodo_pago==='qr'||p.metodo_pago==='tarjeta';
  const vuelto=p.metodo_pago==='efectivo'&&Number(p.paga_con)>Number(p.total)?Number(p.paga_con)-Number(p.total):0;
  const env=(p.items||[]).filter(i=>i.envase==='tengo').reduce((a,i)=>a+(Number(i.envases)||0),0);
  $('app').innerHTML=(p.mis?'<a class="back" href="entrega.html?r='+esc(p.mis)+'">← Mis entregas</a>':'')+'<div class="kicker">Guaripola · Entrega'+(p.repartidor?' · '+esc(p.repartidor):'')+'</div>'+
    '<h1>Pedido #'+esc(p.numero)+'<span class="est '+esc(p.estado)+'">'+(EST[p.estado]||esc(p.estado))+'</span></h1>'+
    '<div class="card"><div class="lbl">Cliente</div><div class="big">'+esc(p.cliente_nombre)+'</div><div class="small">'+esc(p.cliente_telefono)+'</div>'+
      '<div class="row"><a class="b" href="tel:'+esc(p.cliente_telefono)+'">📞 Llamar</a><a class="b wa" target="_blank" rel="noopener" href="https://wa.me/'+wa(p.cliente_telefono)+'">💬 WhatsApp</a></div></div>'+
    '<div class="card"><div class="lbl">Dirección'+(p.delivery_km!=null?' · '+String(Math.round(p.delivery_km*10)/10).replace('.',',')+' km':'')+'</div><div class="big" style="font-size:17px">'+esc(p.direccion||'—')+'</div>'+
      (c?'':'<div class="small" style="margin-top:4px">⚠️ El cliente no compartió su ubicación. Llamalo si no encontrás la dirección.</div>')+
      '<div class="row"><a class="b" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination='+dest+'">🗺️ Google Maps</a>'+
      (c?'<a class="b" target="_blank" rel="noopener" href="https://waze.com/ul?ll='+dest+'&navigate=yes">🚙 Waze</a>':'')+'</div></div>'+
    '<div class="card"><div class="lbl">Pedido</div>'+(p.items||[]).map(i=>'<div class="it"><span>'+esc(i.cantidad)+'× '+esc(i.nombre)+'</span></div>').join('')+
      (env?'<div class="small ok" style="margin-top:8px">♻️ Retirar '+env+' envase'+(env>1?'s':'')+' vacío'+(env>1?'s':'')+' del cliente</div>':'')+
      (p.notas?'<div class="small" style="margin-top:8px">📝 '+esc(p.notas)+'</div>':'')+
      (p.mayor_18?'<div class="fact" style="background:#fdecec;color:var(--err)">🔞 Tiene alcohol o cigarrillos: pedí la cédula. Si es menor de 18, no lo entregues.</div>':'')+
      (p.factura_ruc?'<div class="fact">🧾 Lleva factura: RUC '+esc(p.factura_ruc)+' · '+esc(p.factura_razon||'')+'</div>':'')+'</div>'+
    '<div class="card"><div class="lbl">Cobro · '+esc(PAGO[p.metodo_pago]||p.metodo_pago)+'</div>'+
      (p.metodo_pago==='transferencia'?'<div class="big">Transferencia</div><div class="small">Confirmá con el local si ya está pagado antes de entregar.</div>':
        '<div class="cobrar">Cobrar '+gs(p.total)+'</div>'+(p.metodo_pago==='qr'?'<div class="small">Con QR al entregar.</div>':p.metodo_pago==='tarjeta'?'<div class="small">Con POS al entregar.</div>':'')+
        (vuelto?'<div class="small" style="margin-top:4px">Paga con '+gs(p.paga_con)+' → llevar vuelto <b>'+gs(vuelto)+'</b></div>':''))+'</div>'+
    (p.estado==='en_camino'?'<div class="card live"><div class="lbl">📍 Ubicación para el cliente</div><div class="small">1. Tocá el botón: se abre el chat con el mensaje listo.<br>2. En WhatsApp tocá 📎 → <b>Ubicación</b> → <b>Compartir ubicación en tiempo real</b> (1 hora).</div>'+
      '<a class="b wa" target="_blank" rel="noopener" href="https://wa.me/'+wa(p.cliente_telefono)+'?text='+encodeURIComponent(avisoTxt(p))+'">📍 Avisar al cliente y compartir ubicación</a></div>':'')+
    (p.estado==='cancelado'?'<div class="card" style="color:var(--err);font-weight:800">Este pedido fue cancelado. No lo entregues.</div>':
      p.estado==='entregado'?'<div class="card ok" style="text-align:center">✅ Entregado. ¡Gracias!</div>':
      (p.estado!=='en_camino'?'<button class="go" id="bSali" onclick="marcar(\'en_camino\')">🛵 Salí con el pedido</button>':'')+
      '<button class="go done" id="bEnt" onclick="marcar(\'entregado\')">✅ Entregado</button>')+
    '<p class="small" style="text-align:center;margin-top:16px">Este link sirve solo para este pedido.</p>';
}
// ─── Mis entregas: link personal del repartidor (entrega.html?r=...) ───
const DS=['dom','lun','mar','mié','jue','vie','sáb'];
let fecha=null,D=null;
const hm=t=>t?new Date(t).toLocaleTimeString('es-PY',{hour:'2-digit',minute:'2-digit',hourCycle:'h23'}):'';
function renderDia(){
  const d=D,f=new Date(d.fecha+'T12:00:00'),hoy=!fecha;
  $('app').innerHTML='<div class="kicker">Guaripola · Mis entregas</div><h1>🛵 '+esc(d.nombre)+'</h1>'+
    '<div class="dia"><button onclick="mover(-1)" aria-label="Noche anterior">‹</button><b>'+(hoy?'Esta noche · ':'Noche del ')+DS[f.getDay()]+' '+f.toLocaleDateString('es-PY',{day:'2-digit',month:'2-digit'})+'</b><button onclick="mover(1)" aria-label="Noche siguiente"'+(hoy?' disabled style="opacity:.3"':'')+'>›</button></div>'+
    '<div class="stats"><div><b class="ok">'+d.entregados+'</b><span>Entregados</span></div><div><b style="color:var(--acc2)">'+d.en_camino+'</b><span>En camino</span></div><div><b>'+d.asignados+'</b><span>Por salir</span></div></div>'+
    '<div class="card"><div class="lbl">💵 Efectivo cobrado (a rendir al local)</div><div class="cobrar">'+gs(d.efectivo)+'</div></div>'+
    '<div class="card"><div class="lbl">Pedidos</div>'+(d.pedidos.length?d.pedidos.map(x=>{
      const inner='<span><b>#'+esc(x.numero)+'</b> '+esc(x.cliente_nombre)+'<br><span class="small">'+esc(x.direccion||'')+(x.delivery_km!=null?' · '+String(Math.round(x.delivery_km*10)/10).replace('.',',')+' km':'')+'</span></span>'+
        '<span style="text-align:right;white-space:nowrap"><span class="est '+esc(x.estado)+'" style="box-shadow:none">'+(EST[x.estado]||esc(x.estado))+'</span><br><span class="small">'+(x.entregado_at?hm(x.entregado_at):x.salio_at?'salió '+hm(x.salio_at):'')+'</span></span>';
      return x.t?'<a class="ped" href="entrega.html?t='+esc(x.t)+'">'+inner+'</a>':'<div class="ped">'+inner+'</div>';}).join(''):'<div class="small">Todavía no tenés pedidos asignados'+(hoy?' esta noche.':'.')+'</div>')+'</div>'+
    '<p class="small" style="text-align:center;margin-top:16px">Guardá este link: es tu lista personal. Se actualiza sola.</p>';
}
function mover(n){const base=new Date((fecha||D.fecha)+'T12:00:00');base.setDate(base.getDate()+n);const s=base.toISOString().slice(0,10);fecha=s>=D.hoy?null:s;cargarDia();}
async function cargarDia(){
  try{const d=await rpc('pedidos_repartidor_dia',{p_rtk:RK,p_fecha:fecha});
    if(!d){$('app').innerHTML='<div class="empty">Este link no es válido.<br>Pedile tu link al local.</div>';return;}
    if(!fecha)d.hoy=d.fecha;else d.hoy=D&&D.hoy||d.fecha;D=d;renderDia();}
  catch(e){if(!D)$('app').innerHTML='<div class="empty">Sin conexión. <br><br><button class="b" onclick="cargarDia()">Reintentar</button></div>';}
}
async function cargar(){
  if(!TK){$('app').innerHTML='<div class="empty">Link inválido.</div>';return;}
  try{const p=await rpc('pedidos_repartidor',{p_token:TK});if(!p){$('app').innerHTML='<div class="empty">Este link venció o no es válido.<br>Pedile uno nuevo al local.</div>';return;}P=p;render();}
  catch(e){if(!P)$('app').innerHTML='<div class="empty">Sin conexión. <br><br><button class="b" onclick="cargar()">Reintentar</button></div>';}
}
async function marcar(est){
  if(est==='entregado'&&!confirm('¿Confirmás que entregaste el pedido #'+P.numero+(P.metodo_pago!=='transferencia'?' y cobraste '+gs(P.total):'')+'?'))return;
  document.querySelectorAll('.go').forEach(b=>b.disabled=true);
  try{const r=await rpc('pedidos_repartidor_estado',{p_token:TK,p_estado:est});if(!r||!r.ok)alert((r&&r.error)||'No se pudo actualizar.');}catch(e){alert('Sin conexión. Probá de nuevo.');}
  cargar();
}
if(RK&&!TK){cargarDia();setInterval(()=>{if(!fecha)cargarDia();},30000);}
else{cargar();setInterval(()=>{if(P&&!['entregado','cancelado'].includes(P.estado))cargar();},30000);}
</script>
</body>
</html>
