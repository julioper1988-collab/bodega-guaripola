<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pedidos Guaripola</title>
<meta name="description" content="Pedí asaditos y productos de la bodega Guaripola. Delivery o retiro.">
<meta name="theme-color" content="#1a1310">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#faf6f1;--bg2:#fff;--bg3:#f1e9df;--text:#2a1d14;--text2:#7a6857;--border:#e6dacb;--acc:#d9480f;--acc2:#b83a08;--ok:#2b8a3e;--err:#c92a2a;--r:14px}
@media (prefers-color-scheme:dark){:root{--bg:#1a1310;--bg2:#251b16;--bg3:#30241d;--text:#f5ebe1;--text2:#b5a291;--border:#3d2f26;--acc:#ff6b2c;--acc2:#e8590c;--ok:#51cf66;--err:#ff6b6b}}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:96px}
button,input,textarea{font:inherit;color:inherit}
header{padding:20px 16px 12px;max-width:720px;margin:0 auto}
header h1{font-size:24px}
header p{color:var(--text2);font-size:13px;margin-top:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.banner{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;margin:8px 0;font-size:14px}
.banner.closed{border-color:var(--err);color:var(--err);font-weight:600}
.tabs{display:flex;gap:8px;position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:5}
.tab{flex:1;padding:12px;border-radius:var(--r);border:1px solid var(--border);background:var(--bg2);font-weight:600;cursor:pointer}
.tab.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tab small{display:block;font-size:11px;font-weight:600;opacity:.85;margin-top:2px}
.tab small::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:5px;vertical-align:1px}
.tab small.cl::before{background:var(--err)}
.hor{font-size:12px;color:var(--text2);margin:4px 0 2px}
.cerrado .qty{display:none}
.cerrado .item{opacity:.6}
.search{width:100%;padding:12px 14px;border-radius:var(--r);border:1px solid var(--border);background:var(--bg2);margin-bottom:8px}
.cat{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--text2);margin:16px 0 6px;font-weight:700}
.item{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;margin-bottom:8px}
.item .row,.pack{display:flex;align-items:center;gap:12px}
.pack{margin-top:8px;padding-top:8px;border-top:1px dashed var(--border)}
.pack .nom{font-size:14px}
.save{color:var(--ok);font-weight:600;font-size:12px}
.ret{color:var(--acc);font-weight:600;font-size:12px}
.env{margin-top:8px;padding-top:8px;border-top:1px dashed var(--border)}
.env .seg{margin-top:6px}.env .seg button{padding:8px;font-size:13px}
.env.falta .small{color:var(--err);font-weight:600}
.item img{width:48px;height:48px;object-fit:cover;border-radius:10px;background:var(--bg3);flex:none}
.item .info,.pack .info{flex:1;min-width:0}
.item .nom{font-weight:600;overflow-wrap:anywhere}
.item .pr{color:var(--text2);font-size:13px}
.item.off{opacity:.5}
.qty{display:flex;align-items:center;gap:6px;flex:none}
.qty button{width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:var(--bg3);font-size:18px;font-weight:700;cursor:pointer;transition:transform .12s ease,background .15s;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.qty button:active{transform:scale(.86)}
.qty button.add{background:var(--acc);border-color:var(--acc);color:#fff}
.qn{width:42px;height:34px;text-align:center;font-weight:700;font-size:16px;border:1px solid var(--border);border-radius:10px;background:var(--bg2)}
.qn:focus{outline:2px solid var(--acc);border-color:var(--acc)}
.bump{animation:bump .28s ease}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.14)}100%{transform:scale(1)}}
.fade{animation:fade .22s ease}
@keyframes fade{from{opacity:.35;transform:translateY(4px)}to{opacity:1;transform:none}}
.slide{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s ease}
.slide.open{grid-template-rows:1fr}
.slide>div{overflow:hidden}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.empty{color:var(--text2);text-align:center;padding:32px 0}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--border);z-index:10}
.bar button{width:100%;max-width:688px;margin:0 auto;display:flex;justify-content:space-between;padding:15px 18px;border:0;border-radius:var(--r);background:var(--acc);color:#fff;font-weight:700;font-size:16px;cursor:pointer}
.bar button:disabled{opacity:.5;cursor:default}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,0);z-index:20;display:none;align-items:flex-end;justify-content:center;transition:background .25s ease}
.sheet.on{display:flex}
.sheet.show{background:rgba(0,0,0,.45)}
.sheet .box{transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1);background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet.show .box{transform:none}
.sheet h2{font-size:19px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.x{border:0;background:var(--bg3);width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer}
.line{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:14px}
.line.tot{font-weight:800;font-size:17px;border-top:1px solid var(--border);margin-top:6px;padding-top:10px}
.sub{font-size:12px;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;margin-top:10px;font-weight:700}
label{display:block;font-size:13px;color:var(--text2);margin:12px 0 4px}
.in{width:100%;padding:12px;border-radius:12px;border:1px solid var(--border);background:var(--bg2)}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:11px;border-radius:12px;border:1px solid var(--border);background:var(--bg2);cursor:pointer;font-weight:600}
.seg button.on{border-color:var(--acc);background:var(--acc);color:#fff}
.seg.pagos{flex-wrap:wrap}.seg.pagos button{flex:1 1 40%}
.btn{width:100%;padding:15px;border:0;border-radius:var(--r);background:var(--acc);color:#fff;font-weight:700;font-size:16px;margin-top:16px;cursor:pointer}
.btn.sec{background:var(--bg3);color:var(--text)}
.btn.wa{background:#25d366}
.btn:disabled{opacity:.6}
.err{color:var(--err);font-size:14px;margin-top:10px}
.small{font-size:12px;color:var(--text2)}
.done{text-align:center;padding:24px 0}
.done .num{font-size:44px;font-weight:800;color:var(--acc)}
.estado{display:inline-block;margin-top:8px;padding:6px 14px;border-radius:999px;background:var(--bg3);font-weight:700}
.hide{display:none!important}
</style>
</head>
<body>
<header>
  <h1>🔥 Guaripola</h1>
  <p>Asaditos + bodega en un solo pedido</p>
</header>
<div class="wrap">
  <div id="msg"></div>
  <div class="tabs">
    <button class="tab on" data-t="asadito">🔥 Asadito<small id="st-asadito"></small></button>
    <button class="tab" data-t="bodega">🛒 Bodega<small id="st-bodega"></small></button>
  </div>
  <input id="q" class="search hide" placeholder="Buscar en la bodega…" autocomplete="off">
  <div id="list"><div class="empty">Cargando menú…</div></div>
</div>

<div class="bar"><button id="cartBtn" disabled><span id="cartCount">Carrito vacío</span><span id="cartTot"></span></button></div>

<div class="sheet" id="sheet"><div class="box" id="box"></div></div>

<script>
const SB_URL='https://sdpysvowvwucjfnyosuf.supabase.co';
const SB_KEY='sb_publishable_Px9Uz083rGIy3drTUvlDdw_otNlwCvs';
const LS_ENV='gp_ped_env',LS_CART='gp_ped_cart', LS_CLI='gp_ped_cli', LS_LAST='gp_ped_last';
let cat={config:{},asadito:[],bodega:[]}, tab='asadito', q='', cart=lsGet(LS_CART,{}), ent='retiro', pago='efectivo';

function lsGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}
  // en navegadores internos, el link lleva el carrito para que "Abrir en el navegador" no lo pierda
  try{if(k===LS_CART&&IN_APP){const u=new URL(location.href);u.searchParams.delete('c');if(v&&Object.keys(v).length)u.searchParams.set('c',btoa(JSON.stringify(v)));history.replaceState(null,'',u.pathname+u.search);}}catch(e){}}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function gs(n){return 'Gs. '+Math.round(Number(n)||0).toLocaleString('es-PY');}
function $(id){return document.getElementById(id);}
async function rpc(fn,body){
  const r=await fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(body||{})});
  if(!r.ok) throw new Error('Error de conexión ('+r.status+')');
  return r.json();
}
// Clave de carrito: "asadito:ID", "bodega:ID" o "bodega:ID|PACK_ID"
const key=(o,id,pk)=>o+':'+id+(pk?'|'+pk:'');
function line(k){
  const [o,rest]=k.split(/:(.+)/),[id,pk]=String(rest||'').split('|');
  const p=(cat[o]||[]).find(x=>String(x.id)===id);if(!p)return null;
  const env=o==='bodega'&&p.envase?p.envase:null;
  if(!pk)return {o,id,p,uds:1,env,precio:p.precio,nombre:p.nombre,disponible:p.disponible!==false};
  const pc=(p.packs||[]).find(x=>x.id===pk);if(!pc)return null;
  return {o,id,pk,p,uds:pc.cantidad,env,precio:pc.precio,nombre:p.nombre+' · Pack x'+pc.cantidad,disponible:pc.disponible!==false};
}
function prod(k){return line(k);}
// Retornables: envs[k] = 'tengo' (cambia envases) | 'cobrar' (se cobra el envase)
let envs=lsGet(LS_ENV,{});
function envCosto(k){const l=line(k);return l&&l.env&&envs[k]==='cobrar'?l.env.precio*l.uds*(cart[k]||0):0;}
function envHtml(k){
  const l=line(k);if(!l||!l.env)return '';const n=l.uds*(cart[k]||0),e=envs[k];
  return '<div class="env'+(e?'':' falta')+'" data-envq="'+esc(k)+'"><div class="small">♻️ Retornable: ¿tenés '+(n>1?n+' envases':'el envase')+' para cambiar?</div><div class="seg">'+
    '<button data-env="'+esc(k)+'" data-v="tengo" class="'+(e==='tengo'?'on':'')+'">Sí, tengo</button>'+
    '<button data-env="'+esc(k)+'" data-v="cobrar" class="'+(e==='cobrar'?'on':'')+'">No · +'+gs(l.env.precio*n)+'</button></div></div>';
}

async function load(){
  try{
    cat=await rpc('pedidos_catalogo');
    // limpiar del carrito lo que ya no está disponible
    for(const k of Object.keys(cart)){const l=line(k);if(!l||!l.disponible)delete cart[k];}
    lsSet(LS_CART,cart);
    const c=cat.config||{};
    if(c.ahora)skew=Date.parse(c.ahora+'Z')-Date.now();
    // si el asadito está cerrado y la bodega abierta, arrancar en bodega
    if(primeraVez){primeraVez=false;if(!abierto('asadito')&&abierto('bodega'))tab='bodega';}
    $('msg').innerHTML=(!c.abierto?'<div class="banner closed">⏸ En este momento no estamos recibiendo pedidos.</div>':'')+
      (c.mensaje?'<div class="banner">'+esc(c.mensaje)+'</div>':'');
    render();
  }catch(e){$('list').innerHTML='<div class="empty">No se pudo cargar el menú. <br><button class="btn sec" onclick="load()">Reintentar</button></div>';}
}

// ─── Horarios (hora de Paraguay tomada del servidor) ───
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'],DC=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
let skew=0,primeraVez=true;
function pyNow(){return new Date(Date.now()+skew);} // usar getUTC*: es la hora de pared de Paraguay
const mins=x=>{const [h,m]=String(x).split(':').map(Number);return h*60+(m||0);};
const hhmm=x=>x==='24:00'?'00:00':x;
function hor(l){const h=(cat.config&&cat.config.horarios||{})[l];return h||null;} // null = sin horario (siempre abierto)
function abierto(l,d){
  const h=hor(l);if(!h)return true;d=d||pyNow();
  const dw=d.getUTCDay(),m=d.getUTCHours()*60+d.getUTCMinutes();
  const en=(r,off)=>{if(!r)return false;let a=mins(r[0]),c=mins(r[1]);if(c<=a)c+=1440;return off?(c>1440&&m<c-1440):(m>=a&&m<c);};
  return en(h[dw],false)||en(h[(dw+6)%7],true);
}
function proxima(l){
  const h=hor(l);if(!h)return '';const d=pyNow(),dw=d.getUTCDay(),m=d.getUTCHours()*60+d.getUTCMinutes();
  for(let i=0;i<8;i++){const r=h[(dw+i)%7];if(!r)continue;if(i===0&&mins(r[0])<=m)continue;
    return (i===0?'hoy':i===1?'mañana':'el '+DIAS[(dw+i)%7])+' a las '+hhmm(r[0]);}
  return '';
}
function horarioTxt(l){
  const h=hor(l);if(!h)return '';const g=[];
  for(const i of [1,2,3,4,5,6,0]){const r=h[i],k=r?r.join('-'):'';const u=g[g.length-1];
    if(u&&u.k===k)u.fin=i;else g.push({k,ini:i,fin:i,r});}
  return g.filter(x=>x.r).map(x=>(x.ini===x.fin?DC[x.ini]:DC[x.ini]+' a '+DC[x.fin])+' '+hhmm(x.r[0])+'–'+hhmm(x.r[1])).join(' · ');
}
function estadoTabs(){
  for(const l of ['asadito','bodega']){const e=$('st-'+l);if(!e)continue;const ab=abierto(l);e.textContent=ab?'Abierto':'Cerrado';e.classList.toggle('cl',!ab);}
}

function qtyHtml(k,n){
  const ek=esc(k);
  return n?'<button class="mn" data-k="'+ek+'" data-d="-1" aria-label="Quitar">−</button><input class="qn" data-k="'+ek+'" value="'+n+'" inputmode="numeric" pattern="[0-9]*" maxlength="2" aria-label="Cantidad"><button class="add" data-k="'+ek+'" data-d="1" aria-label="Agregar">+</button>'
    :'<button class="add" data-k="'+ek+'" data-d="1" aria-label="Agregar">+</button>';
}
function render(){
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  $('q').classList.toggle('hide',tab!=='bodega');
  let items=cat[tab]||[];
  if(tab==='bodega'&&q){const t=q.toLowerCase();items=items.filter(p=>p.nombre.toLowerCase().includes(t)||String(p.categoria).toLowerCase().includes(t));}
  const L=$('list'),ab=abierto(tab),ht=horarioTxt(tab);
  estadoTabs();
  L.classList.toggle('cerrado',!ab);
  const cab=(!ab?'<div class="banner closed">🔒 '+(tab==='asadito'?'El asadito':'La bodega')+' está cerrado ahora.'+(proxima(tab)?' Abre '+proxima(tab)+'.':'')+'</div>':'')+(ht?'<div class="hor">🕐 '+esc(ht)+'</div>':'');
  if(!items.length){L.innerHTML=cab+'<div class="empty">'+(q?'Sin resultados':'Pronto vas a encontrar productos acá')+'</div>';renderBar();return;}
  let h='',last=null;
  for(const p of items){
    if(p.categoria!==last){last=p.categoria;h+='<div class="cat">'+esc(last)+'</div>';}
    const k=key(tab,p.id),off=p.disponible===false;
    const packs=(p.packs||[]).filter(x=>x.disponible!==false);
    h+='<div class="item'+(off&&!packs.length?' off':'')+'"><div class="row">'+(p.imagen_url?'<img loading="lazy" src="'+esc(p.imagen_url)+'" alt="">':'')+
      '<div class="info"><div class="nom">'+esc(p.nombre)+'</div><div class="pr">'+(off?'Agotado por unidad':gs(p.precio)+(packs.length?' c/u':''))+(p.envase?' <span class="ret">♻️ retornable</span>':'')+'</div></div>'+
      (off?'':'<div class="qty" data-q="'+esc(k)+'">'+qtyHtml(k,cart[k]||0)+'</div>')+'</div>'+
      packs.map(pc=>{const pk=key(tab,p.id,pc.id),ahorro=p.precio*pc.cantidad-pc.precio;
        return '<div class="pack"><div class="info"><div class="nom">📦 Pack x'+pc.cantidad+'</div><div class="pr">'+gs(pc.precio)+(ahorro>0?' <span class="save">ahorrás '+gs(ahorro)+'</span>':'')+'</div></div><div class="qty" data-q="'+esc(pk)+'">'+qtyHtml(pk,cart[pk]||0)+'</div></div>';}).join('')+
      '</div>';
  }
  L.innerHTML=cab+h;L.classList.remove('fade');void L.offsetWidth;L.classList.add('fade');
  renderBar();
}
function totals(){
  let a=0,b=0,n=0;
  for(const [k,c] of Object.entries(cart)){const l=line(k);if(!l)continue;n+=c;if(l.o==='asadito')a+=l.precio*c;else b+=l.precio*c+envCosto(k);}
  return {a,b,n,sub:a+b};
}
function bump(el){if(!el)return;el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump');}
function renderBar(anim){
  const t=totals();
  $('cartBtn').disabled=!t.n;
  $('cartCount').textContent=t.n?('Ver pedido ('+t.n+')'):'Carrito vacío';
  $('cartTot').textContent=t.n?gs(t.sub):'';
  if(anim)bump($('cartBtn'));
}
// Actualiza solo los controles del producto tocado (sin redibujar la lista)
function setQty(k,v,abs){
  const prev=cart[k]||0;
  let n=abs?v:prev+v; n=Math.max(0,Math.min(99,Math.floor(Number(n)||0)));
  if(n===prev&&!abs)return;
  if(n<=0){delete cart[k];if(envs[k]){delete envs[k];lsSet(LS_ENV,envs);}}else cart[k]=n;
  lsSet(LS_CART,cart);
  document.querySelectorAll('.qty[data-q="'+CSS.escape(k)+'"]').forEach(q=>{
    const hadInput=!!q.querySelector('.qn');
    if(!!n!==hadInput){q.innerHTML=qtyHtml(k,n);}
    else if(n){const i=q.querySelector('.qn');if(document.activeElement!==i)i.value=n;}
    bump(q.querySelector('.qn'));
  });
  renderBar(n>prev);
  if($('sheet').classList.contains('on')&&$('sh-lines'))updateSheet(!n);
}

function linesHtml(){
  let h='';
  for(const o of ['asadito','bodega']){
    const ks=Object.keys(cart).filter(k=>k.startsWith(o+':')&&line(k));
    if(!ks.length)continue;
    h+='<div class="sub">'+(o==='asadito'?'🔥 Asadito':'🛒 Bodega')+(abierto(o)?'':' · <span style="color:var(--err)">cerrado ahora'+(proxima(o)?', abre '+proxima(o):'')+'</span>')+'</div>';
    for(const k of ks){const l=line(k);h+='<div class="item"><div class="row"><div class="info"><div class="nom">'+esc(l.nombre)+'</div><div class="pr" data-st="'+esc(k)+'">'+gs(l.precio*cart[k])+'</div></div><div class="qty" data-q="'+esc(k)+'">'+qtyHtml(k,cart[k])+'</div></div>'+envHtml(k)+'</div>';}
  }
  return h;
}
const PAGOS={efectivo:['Efectivo',''],transferencia:['Transferencia','Te enviamos los datos para transferir al confirmar.'],qr:['QR','Pagás escaneando el QR al recibir o retirar.'],tarjeta:['Tarjeta','Débito o crédito con POS al recibir o retirar.']};
function metodos(){const m=(cat.config&&cat.config.metodos_pago)||['efectivo','transferencia'];return m.filter(x=>PAGOS[x]);}
function totHtml(){
  const c=cat.config||{},t=totals(),dl=ent==='delivery'?Number(c.costo_delivery)||0:0;
  const envT=Object.keys(cart).reduce((a,k)=>a+envCosto(k),0);
  return (envT?'<div class="line"><span>♻️ Envases</span><span>'+gs(envT)+'</span></div>':'')+'<div class="line"><span>Subtotal</span><span>'+gs(t.sub)+'</span></div>'+
    (ent==='delivery'?'<div class="line"><span>Delivery</span><span>'+(dl?gs(dl):'A confirmar')+'</span></div>':'')+
    '<div class="line tot"><span>Total</span><span>'+gs(t.sub+dl)+'</span></div>'+
    (c.pedido_minimo>0&&t.sub<c.pedido_minimo?'<div class="err">Pedido mínimo: '+gs(c.pedido_minimo)+'</div>':'');
}
function entHtml(){
  const cli=lsGet(LS_CLI,{});
  return '<div class="seg"><button data-ent="retiro" class="'+(ent==='retiro'?'on':'')+'">Retiro en local</button><button data-ent="delivery" class="'+(ent==='delivery'?'on':'')+'">Delivery</button></div>'+
    '<div class="slide'+(ent==='delivery'?' open':'')+'"><div><label>Dirección y referencia</label><input id="f-dir" class="in" autocomplete="street-address" value="'+esc(($('f-dir')&&$('f-dir').value)||cli.direccion||'')+'">'+
    '<input id="f-ubi" type="hidden" value="'+esc(($('f-ubi')&&$('f-ubi').value)||'')+'"><button class="btn sec" id="ubiBtn" type="button">📍 Compartir mi ubicación</button></div></div>';
}
function pagoHtml(){
  return '<div class="seg pagos">'+metodos().map(m=>'<button data-pago="'+m+'" class="'+(pago===m?'on':'')+'">'+PAGOS[m][0]+'</button>').join('')+'</div>'+
    '<div class="slide'+(pago==='efectivo'?' open':'')+'"><div><label>¿Con cuánto pagás? (opcional, para el vuelto)</label><input id="f-paga" class="in" inputmode="numeric" value="'+esc(($('f-paga')&&$('f-paga').value)||'')+'"></div></div>'+
    (pago!=='efectivo'?'<p class="small" style="margin-top:8px">'+PAGOS[pago][1]+'</p>':'');
}
// Redibuja líneas solo si cambió la cantidad de renglones; si no, actualiza subtotales en el lugar
function updateSheet(estructura){
  if(!totals().n){closeSheet();return;}
  if(estructura)$('sh-lines').innerHTML=linesHtml();
  else for(const k of Object.keys(cart)){const el=document.querySelector('[data-st="'+CSS.escape(k)+'"]'),l=line(k);if(el&&l)el.textContent=gs(l.precio*cart[k]);
    const ev=document.querySelector('[data-envq="'+CSS.escape(k)+'"]');if(ev)ev.outerHTML=envHtml(k);}
  if(!estructura&&Object.keys(cart).some(k=>!document.querySelector('[data-st="'+CSS.escape(k)+'"]')))$('sh-lines').innerHTML=linesHtml();
  $('sh-tot').innerHTML=totHtml();
}
function checkout(){
  const c=cat.config||{},t=totals(),cli=lsGet(LS_CLI,{});
  if(!metodos().includes(pago))pago=metodos()[0]||'efectivo';
  if(!t.n){closeSheet();return;}
  $('box').innerHTML='<h2>Tu pedido <button class="x" onclick="closeSheet()" aria-label="Cerrar">✕</button></h2><div id="sh-lines">'+linesHtml()+'</div><div id="sh-tot">'+totHtml()+'</div>'+
    '<label>Nombre</label><input id="f-nom" class="in" autocomplete="name" value="'+esc(cli.nombre||'')+'">'+
    '<label>Teléfono / WhatsApp</label><input id="f-tel" class="in" type="tel" autocomplete="tel" value="'+esc(cli.telefono||'')+'">'+
    '<label>Entrega</label><div id="sh-ent">'+entHtml()+'</div>'+
    '<label>Pago</label><div id="sh-pago">'+pagoHtml()+'</div>'+
    '<label>Notas (opcional)</label><textarea id="f-notas" class="in" rows="2" placeholder="Ej: sin sal, timbre no funciona…"></textarea>'+
    '<div id="f-err" class="err"></div>'+
    '<button class="btn" id="sendBtn"'+(c.abierto?'':' disabled')+'>'+(c.abierto?'Confirmar pedido':'Cerrado por ahora')+'</button>';
  $('sendBtn').onclick=enviar;
  openSheet();
}
function openSheet(){const s=$('sheet');s.classList.add('on');requestAnimationFrame(()=>s.classList.add('show'));}
function closeSheet(){const s=$('sheet');s.classList.remove('show');setTimeout(()=>{if(!s.classList.contains('show'))s.classList.remove('on');},260);}
// Navegadores internos de apps (Instagram, Facebook, TikTok…) suelen bloquear la ubicación
const UA=navigator.userAgent||'';
const IN_APP=/Instagram|FBAN|FBAV|FB_IAB|FBIOS|Messenger|musical_ly|Bytedance|TikTok|Line\//i.test(UA);
const IS_ANDROID=/Android/i.test(UA);
// Link para abrir esta página en el navegador del celular, llevando el carrito
function linkNavegador(){
  const u=new URL(location.href);u.hash='';u.searchParams.delete('c');if(Object.keys(cart).length)u.searchParams.set('c',btoa(JSON.stringify(cart)));
  return IS_ANDROID?'intent://'+u.host+u.pathname+u.search+u.hash+'#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url='+encodeURIComponent(u.href)+';end':u.href;
}
function ayudaNavegador(){
  return IS_ANDROID?'<a class="btn sec" style="display:block;text-align:center;text-decoration:none;margin-top:8px" href="'+esc(linkNavegador())+'">🌐 Abrir en Chrome (tu pedido se mantiene)</a>'
    :'<p class="small" style="margin-top:8px">Tocá <b>⋯</b> arriba a la derecha → <b>Abrir en el navegador</b> (Safari). Tu pedido se mantiene.</p>';
}
function getUbi(){
  const fallo=m=>{$('ubiBtn').textContent='📍 Compartir mi ubicación';$('f-err').innerHTML=m+(IN_APP?'<br>Desde '+(/Instagram/i.test(UA)?'Instagram':'esta app')+' no se puede compartir la ubicación.'+ayudaNavegador():'')+'<p class="small" style="margin-top:6px">También podés confirmar igual y mandarnos tu ubicación por WhatsApp.</p>';};
  if(!navigator.geolocation){fallo('Tu navegador no permite compartir ubicación.');return;}
  $('ubiBtn').textContent='Obteniendo ubicación…';
  let hecho=false;
  // algunos navegadores internos nunca responden: cortar a los 10 s
  const guard=setTimeout(()=>{if(!hecho){hecho=true;fallo('No se pudo obtener la ubicación.');}},10000);
  navigator.geolocation.getCurrentPosition(p=>{
    if(hecho)return;hecho=true;clearTimeout(guard);
    $('f-ubi').value='https://maps.google.com/?q='+p.coords.latitude.toFixed(6)+','+p.coords.longitude.toFixed(6);
    $('ubiBtn').textContent='📍 Ubicación agregada ✓';$('f-err').textContent='';
  },e=>{if(hecho)return;hecho=true;clearTimeout(guard);fallo(e&&e.code===1?'No diste permiso de ubicación.':'No se pudo obtener la ubicación.');},{enableHighAccuracy:true,timeout:9000});
}
async function enviar(){
  const v=id=>($(id)?.value||'').trim();
  const body={nombre:v('f-nom'),telefono:v('f-tel'),entrega:ent,direccion:ent==='delivery'?v('f-dir'):'',ubicacion:ent==='delivery'?v('f-ubi'):'',metodo_pago:pago,paga_con:pago==='efectivo'?v('f-paga'):'',notas:v('f-notas'),
    items:Object.entries(cart).map(([k,c])=>{const l=line(k);return l?{origen:l.o,id:l.id,pack:l.pk||null,cantidad:c,envase:l.env?envs[k]||null:null}:null;}).filter(Boolean)};
  const sinEnv=Object.keys(cart).find(k=>{const l=line(k);return l&&l.env&&!envs[k];});
  if(sinEnv){const e=document.querySelector('[data-envq="'+CSS.escape(sinEnv)+'"]');if(e){e.scrollIntoView({behavior:'smooth',block:'center'});bump(e);}
    const e2=$('f-err');e2.textContent='Indicá si tenés envases para '+line(sinEnv).nombre+'.';bump(e2);return;}
  const err=m=>{const e=$('f-err');e.textContent=m;bump(e);};
  const cer=['asadito','bodega'].filter(l=>!abierto(l)&&body.items.some(i=>i.origen===l));
  if(cer.length){err((cer[0]==='asadito'?'El asadito':'La bodega')+' está cerrado ahora. Quitá esos productos'+(proxima(cer[0])?' o pedí '+proxima(cer[0]):'')+'.');return;}
  if(body.nombre.length<2){err('Ingresá tu nombre.');return;}
  if(body.telefono.replace(/\D/g,'').length<6){err('Ingresá tu teléfono.');return;}
  if(ent==='delivery'&&!body.direccion){err('Ingresá la dirección.');return;}
  const b=$('sendBtn');b.disabled=true;b.textContent='Enviando…';$('f-err').textContent='';
  try{
    const r=await rpc('pedidos_crear',{p:body});
    if(!r||!r.ok){err((r&&r.error)||'No se pudo enviar.');b.disabled=false;b.textContent='Confirmar pedido';if(r&&/disponible|stock/i.test(r.error||''))load();return;}
    lsSet(LS_CLI,{nombre:body.nombre,telefono:body.telefono,direccion:body.direccion||lsGet(LS_CLI,{}).direccion});
    lsSet(LS_LAST,r.token);
    cart={};lsSet(LS_CART,cart);envs={};lsSet(LS_ENV,envs);render();
    showDone(r,body);
  }catch(e){err('Sin conexión. Probá de nuevo.');b.disabled=false;b.textContent='Confirmar pedido';}
}
const ESTADOS={pendiente:'⏳ Esperando confirmación',aceptado:'✅ Confirmado',preparando:'🔥 En preparación',en_camino:'🛵 En camino',entregado:'🎉 Entregado',cancelado:'❌ Cancelado'};
let pollT=null;
function showDone(r,body){
  const c=cat.config||{},wa=String(c.whatsapp||'').replace(/\D/g,'');
  let txt='';
  if(body&&wa){
    txt='*Pedido #'+r.numero+'* — '+body.nombre+'\n';
    for(const it of r.items||[])txt+='• '+it.cantidad+'x '+it.nombre+(it.origen==='bodega'&&!it.es_envase?' (bodega)':'')+(it.envase==='tengo'?' — tengo '+it.envases+' envase'+(it.envases>1?'s':''):'')+'\n';
    txt+='Total: '+gs(r.total)+'\n'+(body.entrega==='delivery'?'Delivery: '+body.direccion+(body.ubicacion?'\n'+body.ubicacion:'\n📍 Te envío mi ubicación por acá'):'Retiro en local')+'\nPago: '+(PAGOS[body.metodo_pago]?PAGOS[body.metodo_pago][0]:body.metodo_pago);
  }
  $('box').innerHTML='<h2><span></span><button class="x" onclick="closeSheet()">✕</button></h2><div class="done"><div class="small">Pedido</div><div class="num">#'+esc(r.numero)+'</div>'+
    '<div class="estado" id="est">'+(ESTADOS[r.estado||'pendiente'])+'</div>'+(r.total?'<p style="margin-top:12px">Total: <b>'+gs(r.total)+'</b></p>':'')+
    '<p class="small" style="margin-top:10px">Esta pantalla se actualiza sola.</p></div>'+
    (txt?'<a class="btn wa" style="display:block;text-align:center;text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/'+wa+'?text='+encodeURIComponent(txt)+'">Avisar por WhatsApp</a>':'')+
    '<button class="btn sec" onclick="closeSheet()">Seguir pidiendo</button>';
  openSheet();
  clearInterval(pollT);
  const tk=r.token;
  pollT=setInterval(async()=>{
    if(!$('est')){clearInterval(pollT);return;}
    try{const s=await rpc('pedidos_estado',{p_token:tk});if(s&&s.estado){$('est').textContent=ESTADOS[s.estado]||s.estado;if(s.estado==='entregado'||s.estado==='cancelado'){clearInterval(pollT);lsSet(LS_LAST,null);}}}catch(e){}
  },20000);
}
async function resumeLast(){
  const tk=lsGet(LS_LAST,null);if(!tk)return;
  try{const s=await rpc('pedidos_estado',{p_token:tk});
    if(s&&s.estado&&!['entregado','cancelado'].includes(s.estado)&&Date.now()-new Date(s.created_at)<12*3600e3)showDone({...s,token:tk},null);
    else lsSet(LS_LAST,null);
  }catch(e){}
}

document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.t){if(tab!==t.dataset.t){tab=t.dataset.t;render();window.scrollTo({top:0,behavior:'smooth'});}}
  else if(t.dataset.k){setQty(t.dataset.k,+t.dataset.d);}
  else if(t.dataset.ent){ent=t.dataset.ent;$('sh-ent').innerHTML=entHtml();$('sh-tot').innerHTML=totHtml();}
  else if(t.dataset.env){envs[t.dataset.env]=t.dataset.v;lsSet(LS_ENV,envs);const ev=document.querySelector('[data-envq="'+CSS.escape(t.dataset.env)+'"]');if(ev)ev.outerHTML=envHtml(t.dataset.env);$('sh-tot').innerHTML=totHtml();renderBar();}
  else if(t.dataset.pago){pago=t.dataset.pago;$('sh-pago').innerHTML=pagoHtml();}
  else if(t.id==='ubiBtn'){getUbi();}
});
// Cantidad escrita a mano
document.addEventListener('change',e=>{const i=e.target.closest('.qn');if(i)setQty(i.dataset.k,i.value,true);});
document.addEventListener('keydown',e=>{const i=e.target.closest&&e.target.closest('.qn');if(i&&e.key==='Enter'){e.preventDefault();i.blur();}});
document.addEventListener('focusin',e=>{const i=e.target.closest&&e.target.closest('.qn');if(i)setTimeout(()=>i.select(),0);});
$('cartBtn').onclick=checkout;
$('sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet();});
let qT;$('q').addEventListener('input',e=>{clearTimeout(qT);qT=setTimeout(()=>{q=e.target.value.trim();render();},200);});
// Carrito traído desde el navegador interno (?c=...)
try{const u=new URL(location.href),c0=u.searchParams.get('c');if(c0){const c=JSON.parse(atob(c0));if(c&&typeof c==='object'){cart=c;lsSet(LS_CART,cart);}u.searchParams.delete('c');history.replaceState(null,'',u.pathname+u.search);}}catch(e){}
if(IN_APP){const d=document.createElement('div');d.className='banner';d.innerHTML='📍 Para compartir tu ubicación, abrí esta página en tu navegador.'+ayudaNavegador();$('msg').after(d);
  d.addEventListener('click',e=>{const a=e.target.closest('a');if(a)a.href=linkNavegador();});}
load().then(resumeLast);
setInterval(()=>{if(!$('sheet').classList.contains('on'))load();},5*60e3);
// abrir/cerrar a la hora justa sin recargar
let ultimo='';setInterval(()=>{if(!cat.config)return;const k=abierto('asadito')+'|'+abierto('bodega');if(ultimo&&k!==ultimo&&!$('sheet').classList.contains('on'))render();ultimo=k;estadoTabs();},30e3);
</script>
</body>
</html>
