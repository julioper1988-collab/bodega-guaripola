<!doctype html>

<style>

#aviso{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#243142;color:#fff;padding:11px 18px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;transition:.25s;z-index:30;pointer-events:none;max-width:calc(100% - 32px);box-shadow:0 8px 24px #0003}
body.conbar #aviso{bottom:calc(100px + env(safe-area-inset-bottom))}
#aviso.on{opacity:1;transform:translate(-50%,0)}
.chk{display:flex;align-items:center;gap:10px;margin-top:16px;color:var(--text);font-size:15px;font-weight:700;cursor:pointer}

.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--border);z-index:10;padding:12px max(16px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));box-shadow:0 -6px 24px #19263b0d;transition:transform .25s ease}
.bar.hide{display:block!important;transform:translateY(110%)}
.barin{max-width:1120px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.sum{display:flex;flex-direction:column;line-height:1.2}

.sheet{position:fixed;inset:0;background:#0b152000;z-index:20;display:none;align-items:flex-end;justify-content:center;transition:background .25s ease}

.sheet.show{background:#0b152087}

.sheet.show .box{transform:none}
@media (min-width:760px){.sheet{justify-content:flex-end;align-items:stretch}.sheet .box{width:min(440px,100%);max-height:none;height:100%;border-radius:24px 0 0 24px;transform:translateX(100%);padding:22px}}
.sheet h2{font-size:21px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;letter-spacing:-.3px}
.sheet .item{margin-bottom:8px;box-shadow:none}
.x{border:0;background:#fff;width:38px;height:38px;border-radius:12px;font-size:17px;cursor:pointer;box-shadow:var(--sh)}
.line{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:14px}
.line.tot{font-weight:800;font-size:18px;border-top:1px solid var(--line);margin-top:6px;padding-top:10px}
.line.promo{color:var(--ok);font-weight:700}.line.promo s{color:var(--text2);font-weight:400;margin-right:6px}
#sh-tot{background:#fff;border-radius:16px;padding:10px 14px;margin:10px 0 4px}
.sub{font-size:12px;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 6px;font-weight:800}
.h4{font-size:16px;font-weight:800;margin:20px 0 4px}
label{display:block;font-size:13px;color:var(--text2);margin:12px 0 5px;font-weight:600}
.in{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:16px}
.in:focus{outline:2px solid #ffc8a6;border-color:var(--acc)}
.sheet input,.sheet textarea,.sheet select{scroll-margin:120px}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-weight:700;transition:background .15s,border-color .15s}
.seg button.on{background:#fff1e6;border-color:#f16e25;color:#d15416}
.seg.pagos{flex-wrap:wrap}.seg.pagos button{flex:1 1 40%}
.env{margin-top:10px;padding-top:10px;border-top:1px dashed var(--border)}

.env.falta .small{color:var(--err);font-weight:700}
.btn{width:100%;padding:16px;border:0;border-radius:14px;background:#ed6923;color:#fff;font-weight:800;font-size:16px;margin-top:16px;cursor:pointer;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn.sec{background:#fff;color:var(--text);border:1px solid var(--line)}
.btn.wa{background:#25d366}

@media (max-width:420px){.top h1{font-size:23px}.hero{padding:20px}.hero h2{font-size:20px}.hero .sym{font-size:44px}.tabs{gap:7px}.tab{font-size:12px;padding:10px 2px 8px}.tab b{font-size:22px}}

<body>
<div class="shell">
<header class="top">
  <div><div class="kicker">Pedidos Guaripola</div><h1 id="hola">Hola, ¿qué pedimos hoy?</h1><p class="muted">Asaditos + bodega en un solo lugar</p></div>
  <div class="acts">
    <button id="misBtn" class="iconbtn hide" aria-label="Mis pedidos" title="Mis pedidos">📋</button>
    <button id="cartIcon" class="iconbtn" aria-label="Ver pedido">🛍️<span id="cartBadge" class="badge hide">0</span></button>
  </div>
</header>
<section class="hero">
  <div><small>PEDÍ MÁS RÁPIDO</small><h2>Tus favoritos, a un toque.</h2><p>Delivery o retiro en el local.</p>
  <div class="estados"><span id="hs-asadito">🔥 Asadito</span><span id="hs-bodega">🛒 Bodega</span></div></div>
  <div class="sym" aria-hidden="true">⚡</div>
</section>
<div id="msg"></div>
<div class="search"><span aria-hidden="true">⌕</span><input id="q" type="search" placeholder="Buscar asaditos, cervezas, gaseosas…" autocomplete="off" enterkeyhint="search"></div>
<nav class="tabs" id="cats">
  <button class="tab on" data-t="todos"><b>🛍️</b>Todos</button>
  <button class="tab" data-t="asadito"><b>🔥</b>Asaditos<small id="st-asadito"></small></button>
  <button class="tab" data-t="bodega"><b>🥤</b>Bodega<small id="st-bodega"></small></button>
  <button class="tab" data-t="promos"><b>🎁</b>Promos</button>
</nav>
<div id="list"><div class="empty">Cargando menú…</div></div>
</div>

<div class="bar hide" id="bar"><div class="barin"><div class="sum"><small id="cartCount">Carrito vacío</small><b id="cartTot"></b></div><button id="cartBtn" class="pill" disabled>Revisar pedido →</button></div></div>

<div class="sheet" id="sheet"><div class="box" id="box"></div></div>

<script>
const SB_URL='https://sdpysvowvwucjfnyosuf.supabase.co';
const SB_KEY='sb_publishable_Px9Uz083rGIy3drTUvlDdw_otNlwCvs';
const LS_ENV='gp_ped_env',LS_CART='gp_ped_cart', LS_CLI='gp_ped_cli', LS_LAST='gp_ped_last';
// Perfil sin registro: todo queda guardado en este celular
const LS_DIRS='gp_ped_dirs', LS_PREV='gp_ped_prev', LS_HIST='gp_ped_hist';
function aviso(t){let e=$('aviso');if(!e){e=document.createElement('div');e.id='aviso';document.body.appendChild(e);}e.textContent=t;e.classList.remove('on');void e.offsetWidth;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2600);}
let cat={config:{},asadito:[],bodega:[]}, tab='todos', q='', cart=lsGet(LS_CART,{}), ent='retiro', pago='efectivo';

function lsGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}
  // en navegadores internos, el link lleva el carrito para que "Abrir en el navegador" no lo pierda
  try{if(k===LS_CART&&IN_APP){const u=new URL(location.href);u.searchParams.delete('c');if(v&&Object.keys(v).length)u.searchParams.set('c',btoa(JSON.stringify(v)));history.replaceState(null,'',u.pathname+u.search);}}catch(e){}}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function gs(n){return 'Gs. '+Math.round(Number(n)||0).toLocaleString('es-PY');}
function $(id){return document.getElementById(id);}
async function rpc(fn,body){
  const r=await fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(body||{})});
  if(!r.ok) throw new Error('Error de conexión ('+r.status+')');
  return r.json();
}
// Clave de carrito: "asadito:ID", "bodega:ID" o "bodega:ID|PACK_ID"
const key=(o,id,pk)=>o+':'+id+(pk?'|'+pk:'');
// Promociones vigentes (vienen del servidor; la base vuelve a calcular todo al confirmar)
const PROMOS=()=>cat.promos||[];
function promoTxt(x){
  const hasta=x.hora_hasta?' hasta las '+hhmm(x.hora_hasta):'',loc=x.local==='asadito'?' del asadito':x.local==='bodega'?' de la bodega':'';
  if(x.tipo==='delivery_gratis')return '🛵 Delivery gratis'+(Number(x.monto_minimo)>0?' desde '+gs(x.monto_minimo):'')+(loc?' en compras'+loc:'')+hasta;
  if(x.tipo==='descuento')return '🏷️ '+Number(x.porcentaje)+'% off en '+(x.categorias&&x.categorias.length?x.categorias.join(', ').toLowerCase():x.productos&&x.productos.length?'productos seleccionados':'todo'+loc)+(Number(x.monto_minimo)>0?' (compras desde '+gs(x.monto_minimo)+')':'')+hasta;
  if(x.tipo==='fidelidad')return '⭐ Cada '+x.cada_n+' pedidos, el siguiente con delivery gratis';
  return x.nombre;
}
function comboInfo(pr){
  const comps=pr.componentes||[],normal=comps.reduce((a,c)=>a+(Number(c.precio)||0)*c.cantidad,0);
  const disp=comps.length&&comps.every(c=>c.disponible&&abierto(c.origen));
  const na=comps.filter(c=>c.origen==='asadito').reduce((a,c)=>a+(Number(c.precio)||0)*c.cantidad,0);
  return {normal,disp,fa:normal?na/normal:0,txt:comps.map(c=>c.cantidad+'× '+c.nombre).join(' + ')};
}
function line(k){
  const [o,rest]=k.split(/:(.+)/),[id,pk]=String(rest||'').split('|');

// ─── Horarios (hora de Paraguay tomada del servidor) ───
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'],DC=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
let skew=0,primeraVez=true;
function pyNow(){return new Date(Date.now()+skew);} // usar getUTC*: es la hora de pared de Paraguay
const mins=x=>{const [h,m]=String(x).split(':').map(Number);return h*60+(m||0);};
const hhmm=x=>x==='24:00'?'00:00':x;
function hor(l){const h=(cat.config&&cat.config.horarios||{})[l];return h||null;} // null = sin horario (siempre abierto)
function abierto(l,d){
  const h=hor(l);if(!h)return true;d=d||pyNow();
  const dw=d.getUTCDay(),m=d.getUTCHours()*60+d.getUTCMinutes();
  const en=(r,off)=>{if(!r)return false;let a=mins(r[0]),c=mins(r[1]);if(c<=a)c+=1440;return off?(c>1440&&m<c-1440):(m>=a&&m<c);};
  return en(h[dw],false)||en(h[(dw+6)%7],true);
}
function proxima(l){
  const h=hor(l);if(!h)return '';const d=pyNow(),dw=d.getUTCDay(),m=d.getUTCHours()*60+d.getUTCMinutes();
  for(let i=0;i<8;i++){const r=h[(dw+i)%7];if(!r)continue;if(i===0&&mins(r[0])<=m)continue;
    return (i===0?'hoy':i===1?'mañana':'el '+DIAS[(dw+i)%7])+' a las '+hhmm(r[0]);}
  return '';
}
function horarioTxt(l){
  const h=hor(l);if(!h)return '';const g=[];
  for(const i of [1,2,3,4,5,6,0]){const r=h[i],k=r?r.join('-'):'';const u=g[g.length-1];
    if(u&&u.k===k)u.fin=i;else g.push({k,ini:i,fin:i,r});}
  return g.filter(x=>x.r).map(x=>(x.ini===x.fin?DC[x.ini]:DC[x.ini]+' a '+DC[x.fin])+' '+hhmm(x.r[0])+'–'+hhmm(x.r[1])).join(' · ');
}

// Vista previa de descuentos % (la mejor promo vigente por línea; no aplica a combos ni envases)
function descPreview(){
  const ps=PROMOS().filter(x=>x.tipo==='descuento');if(!ps.length)return {d:0,da:0};
  let bruto=0;for(const [k,c] of Object.entries(cart)){const l=line(k);if(!l)continue;bruto+=(l.o==='combo'?l.combo.normal:l.precio)*c+envCosto(k);}
  let d=0,da=0;
  for(const [k,c] of Object.entries(cart)){const l=line(k);if(!l||l.o==='combo')continue;
    let best=0;for(const pr of ps){
      if(pr.local&&pr.local!==l.o)continue;
      if(pr.categorias&&pr.categorias.length&&!pr.categorias.includes(l.p.categoria))continue;
      if(pr.productos&&pr.productos.length&&!pr.productos.includes(String(l.id)))continue;
      if(bruto<(Number(pr.monto_minimo)||0))continue;
      best=Math.max(best,Number(pr.porcentaje)||0);}
    const x=Math.round(l.precio*c*best/100);d+=x;if(l.o==='asadito')da+=x;}
  return {d,da};
}
// Cobertura: zonas por distancia en línea recta desde el local (la base vuelve a calcularlo)
function zonas(){const c=cat.config||{};return c.local_lat!=null&&c.local_lng!=null&&Array.isArray(c.zonas_delivery)&&c.zonas_delivery.length?c.zonas_delivery.slice().sort((a,b)=>a.km-b.km):null;}
function kmUbi(){
  const c=cat.config||{},m=String(($('f-ubi')&&$('f-ubi').value)||'').match(/(-?\d{1,3}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)/);
  if(!m||!zonas())return null;
  const r=x=>x*Math.PI/180,la=+m[1],lo=+m[2],a=Math.sin(r(la-c.local_lat)/2)**2+Math.cos(r(c.local_lat))*Math.cos(r(la))*Math.sin(r(lo-c.local_lng)/2)**2;
  return Math.round(2*6371*Math.asin(Math.sqrt(a))*100)/100;
}
const kmTxt=k=>String(Math.max(0.1,Math.round(k*10)/10)).replace('.',',');
// Mapa de cobertura (Leaflet + OpenStreetMap, se carga solo al abrirlo)
let LF=null,covMap=null;
function cargarLeaflet(){return LF||(LF=new Promise((ok,ko)=>{
  const c=document.createElement('link');c.rel='stylesheet';c.href='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css';document.head.appendChild(c);
  const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js';s.onload=()=>ok(window.L);s.onerror=()=>{LF=null;ko();};document.head.appendChild(s);}));}
async function verCobertura(){
  const el=$('cov-map'),b=$('covBtn'),zs=zonas();if(!el||!zs)return;
  if(covMap){covMap.remove();covMap=null;}
  if(!el.classList.contains('hide')){el.classList.add('hide');b.textContent='🗺️ Ver zona de cobertura';return;}
  const c=cat.config,km=Math.max(...zs.map(z=>Number(z.km)||0));
  el.classList.remove('hide');b.textContent='Ocultar mapa · llegamos hasta '+kmTxt(km)+' km';el.innerHTML='<div class="small" style="padding:12px">Cargando mapa…</div>';
  try{
    const L=await cargarLeaflet();if(el.classList.contains('hide'))return;el.innerHTML='';
    const m=covMap=L.map(el).setView([c.local_lat,c.local_lng],13);m.attributionControl.setPrefix(false);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(m);
    const circ=L.circle([c.local_lat,c.local_lng],{radius:km*1000,color:'#ef6a24',weight:2,fillColor:'#ef6a24',fillOpacity:.12}).addTo(m);
    const ic=t=>L.divIcon({html:'<div style="font-size:26px;line-height:1">'+t+'</div>',className:'',iconSize:[28,28],iconAnchor:[14,26]});
    L.marker([c.local_lat,c.local_lng],{icon:ic('🏪')}).addTo(m).bindTooltip('Guaripola');
    const u=String(($('f-ubi')&&$('f-ubi').value)||'').match(/(-?\d{1,3}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)/);
    if(u)L.marker([+u[1],+u[2]],{icon:ic('🏠')}).addTo(m).bindTooltip('Tu ubicación');
    m.fitBounds(circ.getBounds(),{padding:[8,8]});
  }catch(e){el.innerHTML='<div class="small" style="padding:12px">No se pudo cargar el mapa.</div>';}
}
function deliveryInfo(neto,na,nb){
  const zs=ent==='delivery'?zonas():null,km=zs?kmUbi():null,z=km!=null?zs.find(x=>Number(x.km)>=km):null;
  if(km!=null&&!z)return {dl0:0,dl:0,km,fuera:true};
  return Object.assign(deliveryBase(neto,na,nb,z?Number(z.precio)||0:null),{km,sinUbi:!!zs&&km==null});
}
function deliveryBase(neto,na,nb,zp){
  const c=cat.config||{},dl0=ent==='delivery'?(zp!=null?zp:Number(c.costo_delivery)||0):0;
  if(!dl0)return {dl0,dl:0};
  if(esNuevo)return {dl0,dl:0,motivo:'Delivery · primera compra'};
  for(const pr of PROMOS()){
    if(pr.tipo==='fidelidad'&&pr.cada_n>=2&&prevPed>0&&prevPed%pr.cada_n===0)return {dl0,dl:0,motivo:'Delivery · '+pr.nombre};
    if(pr.tipo==='delivery_gratis'){const base=pr.local==='asadito'?na:pr.local==='bodega'?nb:neto;
      if(base>=(Number(pr.monto_minimo)||0))return {dl0,dl:0,motivo:'Delivery gratis'};}
  }
  const dg=PROMOS().filter(x=>x.tipo==='delivery_gratis'&&!x.local).map(x=>Number(x.monto_minimo)||0).sort((a,b)=>a-b)[0];
  return {dl0,dl:dl0,falta:dg!=null&&dg>neto?dg-neto:0};
}

  return (envT?'<div class="line"><span>♻️ Envases</span><span>'+gs(envT)+'</span></div>':'')+'<div class="line"><span>Subtotal</span><span>'+gs(t.sub)+'</span></div>'+
    (dp.d?'<div class="line promo"><span>🏷️ Descuentos</span><span>−'+gs(dp.d)+'</span></div>':'')+
    (ent==='delivery'?(di.fuera?'<div class="line"><span>Delivery · '+kmTxt(di.km)+' km</span><span>No llegamos</span></div><div class="err">📍 Estás a '+kmTxt(di.km)+' km, fuera de nuestra zona de delivery. Podés elegir retiro en el local.</div>':
      di.motivo?'<div class="line promo"><span>🎉 '+esc(di.motivo)+(di.km!=null?' · '+kmTxt(di.km)+' km':'')+'</span><span><s>'+gs(di.dl0)+'</s> Gratis</span></div>':'<div class="line"><span>Delivery'+(di.km!=null?' · '+kmTxt(di.km)+' km':'')+'</span><span>'+(di.dl?gs(di.dl):'A confirmar')+'</span></div>')+
      (di.sinUbi?'<p class="small">📍 Compartí tu ubicación para calcular el delivery según la distancia.</p>':''):'')+
    (di.falta?'<p class="small" style="color:var(--ok);font-weight:600">Te faltan '+gs(di.falta)+' para el delivery gratis 🛵</p>':'')+
    (c.promo_delivery_primera&&!esNuevo&&!telChk&&ent==='delivery'&&di.dl>0?'<p class="small">¿Es tu primera compra online? Poné tu número y el delivery es gratis.</p>':'')+
    '<div class="line tot"><span>Total</span><span>'+gs(neto+(di.dl||0))+'</span></div>'+
    (c.pedido_minimo>0&&neto<c.pedido_minimo?'<div class="err">Pedido mínimo: '+gs(c.pedido_minimo)+'</div>':'');
}

// Navegadores internos de apps (Instagram, Facebook, TikTok…) suelen bloquear la ubicación
const UA=navigator.userAgent||'';
const IN_APP=/Instagram|FBAN|FBAV|FB_IAB|FBIOS|Messenger|musical_ly|Bytedance|TikTok|Line\//i.test(UA);
const IS_ANDROID=/Android/i.test(UA);
// Link para abrir esta página en el navegador del celular, llevando el carrito
function linkNavegador(){
  const u=new URL(location.href);u.hash='';u.searchParams.delete('c');if(Object.keys(cart).length)u.searchParams.set('c',btoa(JSON.stringify(cart)));
  return IS_ANDROID?'intent://'+u.host+u.pathname+u.search+u.hash+'#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url='+encodeURIComponent(u.href)+';end':u.href;
}
function ayudaNavegador(){
  return IS_ANDROID?'<a class="btn sec" style="display:block;text-align:center;text-decoration:none;margin-top:8px" href="'+esc(linkNavegador())+'">🌐 Abrir en Chrome (tu pedido se mantiene)</a>'
    :'<p class="small" style="margin-top:8px">Tocá <b>⋯</b> arriba a la derecha → <b>Abrir en el navegador</b> (Safari). Tu pedido se mantiene.</p>';
}
// De dónde salió la ubicación: 'guardada' (dirección de un pedido anterior) o 'gps' (recién tomada) + precisión en metros
let ubiFuente='',ubiAcc=0;
function ubiInfo(){
  const el=$('ubi-info');if(!el)return;const u=($('f-ubi')&&$('f-ubi').value)||'';
  if(!u||ent!=='delivery'){el.innerHTML='';return;}
  const k=kmUbi();
  el.innerHTML=(k!=null?'📍 A <b>'+kmTxt(k)+' km</b> del local · ':'')+'<a target="_blank" rel="noopener" href="'+esc(u)+'">Ver en el mapa</a>'+
    (ubiFuente==='guardada'?'<br>Es la ubicación guardada de un pedido anterior. Si estás en otro lugar, tocá «Actualizar».':'')+
    (ubiFuente==='gps'&&ubiAcc>150?'<br>⚠️ Ubicación aproximada (±'+(ubiAcc>=1000?kmTxt(ubiAcc/1000)+' km':Math.round(ubiAcc)+' m')+'). Revisá en el mapa que sea tu casa.':'');
}
function getUbi(){
  const fallo=m=>{$('ubiBtn').textContent='📍 Compartir mi ubicación';$('f-err').innerHTML=m+(IN_APP?'<br>Desde '+(/Instagram/i.test(UA)?'Instagram':'esta app')+' no se puede compartir la ubicación.'+ayudaNavegador():'')+'<p class="small" style="margin-top:6px">También podés confirmar igual y mandarnos tu ubicación por WhatsApp.</p>';};
  if(!navigator.geolocation){fallo('Tu navegador no permite compartir ubicación.');return;}
  $('ubiBtn').textContent='Obteniendo ubicación…';
  let hecho=false;
  // algunos navegadores internos nunca responden: cortar a los 10 s
  const guard=setTimeout(()=>{if(!hecho){hecho=true;fallo('No se pudo obtener la ubicación.');}},10000);
  navigator.geolocation.getCurrentPosition(p=>{
    if(hecho)return;hecho=true;clearTimeout(guard);
    // muy imprecisa (ubicación por wifi/antena): mejor no usarla para calcular el delivery
    if(p.coords.accuracy>1500){fallo('Tu celular dio una ubicación muy aproximada (±'+kmTxt(p.coords.accuracy/1000)+' km). Activá la ubicación precisa (GPS) y probá de nuevo.');return;}
    ubiFuente='gps';ubiAcc=p.coords.accuracy||0;
    $('f-ubi').value='https://maps.google.com/?q='+p.coords.latitude.toFixed(6)+','+p.coords.longitude.toFixed(6);
    $('ubiBtn').textContent='📍 Ubicación agregada ✓ · Actualizar';$('f-err').textContent='';if($('sh-tot'))$('sh-tot').innerHTML=totHtml();ubiInfo();
    if($('cov-map')&&!$('cov-map').classList.contains('hide')){$('cov-map').classList.add('hide');verCobertura();}
  },e=>{if(hecho)return;hecho=true;clearTimeout(guard);fallo(e&&e.code===1?'No diste permiso de ubicación.':'No se pudo obtener la ubicación.');},{enableHighAccuracy:true,timeout:9000,maximumAge:0});
}

    items:Object.entries(cart).map(([k,c])=>{const l=line(k);if(!l)return null;if(l.o==='combo')return {origen:'combo',id:l.id,cantidad:c};return {origen:l.o,id:l.id,pack:l.pk||null,cantidad:c,envase:l.env?envs[k]||null:null};}).filter(Boolean)};

     lsSet(LS_PREV,{cart:{...cart},envs:{...envs},ts:Date.now(),n:Object.values(cart).reduce((a,b)=>a+b,0)});

  }catch(e){err('Sin conexión. Probá de nuevo.');b.disabled=false;b.textContent='Confirmar pedido';}
}
const ESTADOS={pendiente:'⏳ Esperando confirmación',aceptado:'✅ Confirmado',preparando:'🔥 En preparación',en_camino:'🛵 En camino',entregado:'🎉 Entregado',cancelado:'❌ Cancelado'};
let pollT=null;
function showDone(r,body){
  const c=cat.config||{},wa=String(c.whatsapp||'').replace(/\D/g,'');
  let txt='';
  if(body&&wa){
    txt='*Pedido #'+r.numero+'* — '+body.nombre+'\n';
    for(const it of r.items||[])txt+='• '+it.cantidad+'x '+it.nombre+(it.origen==='bodega'&&!it.es_envase?' (bodega)':'')+(it.envase==='tengo'?' — tengo '+it.envases+' envase'+(it.envases>1?'s':''):'')+'\n';
    if(Number(r.descuento)>0)txt+='Descuentos: −'+gs(r.descuento)+'\n';
    txt+='Total: '+gs(r.total)+'\n'+(body.entrega==='delivery'?'Delivery: '+body.direccion+(body.ubicacion?'\n'+body.ubicacion:'\n📍 Te envío mi ubicación por acá'):'Retiro en local')+'\nPago: '+(PAGOS[body.metodo_pago]?PAGOS[body.metodo_pago][0]:body.metodo_pago)+(body.factura?'\n🧾 Factura: RUC '+body.factura.ruc+' · '+body.factura.razon:'');
  }
  $('box').innerHTML='<h2><span></span><button class="x" onclick="closeSheet()">✕</button></h2><div class="done"><div class="small">Pedido</div><div class="num">#'+esc(r.numero)+'</div>'+
    '<div class="estado" id="est">'+(ESTADOS[r.estado||'pendiente'])+'</div>'+(r.total?'<p style="margin-top:12px">Total: <b>'+gs(r.total)+'</b></p>':'')+
    '<p class="small" style="margin-top:10px">Esta pantalla se actualiza sola.</p></div>'+
    (txt?'<a class="btn wa" style="display:block;text-align:center;text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/'+wa+'?text='+encodeURIComponent(txt)+'">Avisar por WhatsApp</a>':'')+
    '<button class="btn sec" onclick="closeSheet()">Seguir pidiendo</button>';
  openSheet();
  clearInterval(pollT);
  const tk=r.token;
  pollT=setInterval(async()=>{
    if(!$('est')){clearInterval(pollT);return;}
    try{const s=await rpc('pedidos_estado',{p_token:tk});if(s&&s.estado){$('est').textContent=ESTADOS[s.estado]||s.estado;if(s.estado==='entregado'||s.estado==='cancelado'){clearInterval(pollT);lsSet(LS_LAST,null);}}}catch(e){}
  },20000);
}
// Repetir el último pedido (solo lo que sigue disponible)
function repetirHtml(){
  const pv=lsGet(LS_PREV,null);if(!pv||!pv.cart||Object.keys(cart).length)return '';
  const ok=Object.keys(pv.cart).filter(k=>{const l=line(k);return l&&l.disponible;});if(!ok.length)return '';
  const nom=ok.slice(0,3).map(k=>line(k).nombre.toLowerCase()).join(', ')+(ok.length>3?'…':'');
  return '<div class="repetir"><div><b>🔁 Repetir mi último pedido</b><div class="small">'+esc(nom)+'</div></div><button class="btn" id="repBtn" style="margin:0;width:auto;padding:10px 16px">Repetir</button></div>';
}
function repetir(){
  const pv=lsGet(LS_PREV,null);if(!pv)return;let fal=0;
  for(const [k,c] of Object.entries(pv.cart)){const l=line(k);if(l&&l.disponible){cart[k]=c;if(pv.envs&&pv.envs[k])envs[k]=pv.envs[k];}else fal++;}
  lsSet(LS_CART,cart);lsSet(LS_ENV,envs);render();renderBar(true);
  aviso(fal?'Listo. '+fal+' producto(s) ya no están disponibles.':'Listo, cargamos tu último pedido.');
  checkout();
}
// Mis pedidos: los hechos desde este celular
function misBtn(){$('misBtn').classList.toggle('hide',!lsGet(LS_HIST,[]).length);}
async function misPedidos(){
  const hs=lsGet(LS_HIST,[]);if(!hs.length)return;
  $('box').innerHTML='<h2>Mis pedidos <button class="x" onclick="closeSheet()" aria-label="Cerrar">✕</button></h2>'+hs.map(x=>'<button class="hist" data-tk="'+esc(x.token)+'"><span><b>#'+esc(x.numero)+'</b> · '+new Date(x.ts).toLocaleDateString('es-PY',{day:'2-digit',month:'short'})+' '+new Date(x.ts).toLocaleTimeString('es-PY',{hour:'2-digit',minute:'2-digit'})+'<br><span class="small" data-est="'+esc(x.token)+'">…</span></span><span>'+gs(x.total)+'</span></button>').join('')+
    '<p class="small" style="margin-top:10px">Guardado solo en este celular.</p>';
  openSheet();
  for(const x of hs.slice(0,8)){rpc('pedidos_estado',{p_token:x.token}).then(s=>{const e=document.querySelector('[data-est="'+CSS.escape(x.token)+'"]');if(e)e.textContent=s&&s.estado?ESTADOS[s.estado]:'—';}).catch(()=>{});}
}
async function resumeLast(){
  const tk=lsGet(LS_LAST,null);if(!tk)return;
  try{const s=await rpc('pedidos_estado',{p_token:tk});
    if(s&&s.estado&&!['entregado','cancelado'].includes(s.estado)&&Date.now()-new Date(s.created_at)<12*3600e3)showDone({...s,token:tk},null);
    else lsSet(LS_LAST,null);
  }catch(e){}
}

document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.t){if(tab!==t.dataset.t){tab=t.dataset.t;render();const y=$('list').getBoundingClientRect().top+scrollY-110;if(scrollY>y)window.scrollTo({top:y,behavior:'smooth'});}}
  else if(t.dataset.goto){const g=$(t.dataset.goto);if(g)g.scrollIntoView({behavior:'smooth',block:'start'});}
  else if(t.id==='cartIcon'){if(totals().n)checkout();else aviso('Tu pedido está vacío. Tocá + para agregar.');}
  else if(t.dataset.k){setQty(t.dataset.k,+t.dataset.d);}
  else if(t.dataset.ent){ent=t.dataset.ent;$('sh-ent').innerHTML=entHtml();$('sh-tot').innerHTML=totHtml();ubiInfo();}
  else if(t.dataset.env){envs[t.dataset.env]=t.dataset.v;lsSet(LS_ENV,envs);const ev=document.querySelector('[data-envq="'+CSS.escape(t.dataset.env)+'"]');if(ev)ev.outerHTML=envHtml(t.dataset.env);$('sh-tot').innerHTML=totHtml();renderBar();}
  else if(t.dataset.pago){pago=t.dataset.pago;$('sh-pago').innerHTML=pagoHtml();}
  else if(t.id==='ubiBtn'){getUbi();}
  else if(t.id==='covBtn'){verCobertura();}
  else if(t.dataset.dir!=null){const d=lsGet(LS_DIRS,[])[+t.dataset.dir];if(d){$('f-dir').value=d.dir;$('f-ubi').value=d.ubi||'';$('f-dirlabel').value='';$('ubiBtn').textContent=d.ubi?'📍 Ubicación agregada ✓ · Actualizar':'📍 Compartir mi ubicación';ubiFuente=d.ubi?'guardada':'';$('sh-dirs').innerHTML=dirsHtml();$('sh-tot').innerHTML=totHtml();ubiInfo();}}
  else if(t.dataset.deldir!=null){const ds=lsGet(LS_DIRS,[]);ds.splice(+t.dataset.deldir,1);lsSet(LS_DIRS,ds);$('sh-dirs').innerHTML=dirsHtml();}
  else if(t.id==='repBtn'){repetir();}
  else if(t.id==='misBtn'){misPedidos();}
  else if(t.dataset.tk){rpc('pedidos_estado',{p_token:t.dataset.tk}).then(s=>{if(s&&s.estado)showDone({...s,token:t.dataset.tk},null);}).catch(()=>{});}
});
let telT=null;document.addEventListener('input',e=>{if(e.target.id==='f-tel'){clearTimeout(telT);telT=setTimeout(chkNuevo,500);}
  if(e.target.id==='f-dir'&&ubiFuente==='guardada'&&!lsGet(LS_DIRS,[]).some(d=>d.dir===e.target.value&&d.ubi===$('f-ubi').value)){
    // escribió otra dirección: la ubicación guardada ya no corresponde
    $('f-ubi').value='';ubiFuente='';$('ubiBtn').textContent='📍 Compartir mi ubicación';$('sh-tot').innerHTML=totHtml();ubiInfo();}
  if(e.target.id==='f-dir'&&$('sh-dirs')){$('sh-dirs').innerHTML=dirsHtml();if($('f-dirlabel')&&!$('f-dirlabel').value&&!lsGet(LS_DIRS,[]).some(d=>d.dir===e.target.value))$('f-dirlabel').value=lsGet(LS_DIRS,[]).length?'Otra':'Casa';}});
// RUC: buscar en el padrón de la DNIT y completar razón social y dígito verificador
let rucT=null,rucAuto='';
document.addEventListener('input',e=>{
  if(e.target.id!=='f-ruc')return;
  clearTimeout(rucT);const v=e.target.value.replace(/[^0-9A-Za-z-]/g,''),h=$('ruc-hint');
  if(v.split('-')[0].length<4){if(h)h.textContent='';return;}
  if(h)h.textContent='Buscando…';
  rucT=setTimeout(async()=>{
    try{
      const r=await rpc('pedidos_ruc',{p:v});
      if(!$('f-ruc')||$('f-ruc').value.replace(/[^0-9A-Za-z-]/g,'')!==v)return; // ya cambió
      if(r&&r.razon){
        const full=r.ruc+(r.dv!=null?'-'+r.dv:'');
        if(!v.includes('-'))$('f-ruc').value=full;
        const z=$('f-razon');if(!z.value.trim()||z.value===rucAuto){z.value=r.razon;rucAuto=r.razon;bump(z);}
        const act=!r.estado||/ACTIVO/i.test(r.estado);
        h.innerHTML=act?'<span style="color:var(--ok)">✓ '+esc(r.razon)+'</span>':'<span style="color:var(--err)">⚠️ RUC '+esc(r.estado)+'</span>';
        if(v.includes('-')&&r.dv!=null&&v.split('-')[1]!==String(r.dv))h.innerHTML+='<br><span style="color:var(--err)">El dígito verificador debería ser '+r.dv+' ('+esc(full)+')</span>';
      }else{const z=$('f-razon');if(rucAuto&&z.value===rucAuto){z.value='';rucAuto='';}h.textContent='No encontramos ese RUC. Escribí el nombre o razón social.';}
    }catch(err){h.textContent='';}
  },450);
});
// Cantidad escrita a mano
document.addEventListener('change',e=>{if(e.target.id==='f-fact'){$('sh-fact').classList.toggle('open',e.target.checked);if(e.target.checked)setTimeout(()=>$('f-ruc').focus(),250);return;}const i=e.target.closest('.qn');if(i)setQty(i.dataset.k,i.value,true);});
document.addEventListener('keydown',e=>{const i=e.target.closest&&e.target.closest('.qn');if(i&&e.key==='Enter'){e.preventDefault();i.blur();}});
document.addEventListener('focusin',e=>{const i=e.target.closest&&e.target.closest('.qn');if(i)setTimeout(()=>i.select(),0);});
$('cartBtn').onclick=checkout;
$('sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet();});
let qT;$('q').addEventListener('input',e=>{clearTimeout(qT);qT=setTimeout(()=>{q=e.target.value.trim();render();},200);});
// Carrito traído desde el navegador interno (?c=...)
try{const u=new URL(location.href),c0=u.searchParams.get('c');if(c0){const c=JSON.parse(atob(c0));if(c&&typeof c==='object'){cart=c;lsSet(LS_CART,cart);}u.searchParams.delete('c');history.replaceState(null,'',u.pathname+u.search);}}catch(e){}
if(IN_APP){const d=document.createElement('div');d.className='banner';d.innerHTML='📍 Para compartir tu ubicación, abrí esta página en tu navegador.'+ayudaNavegador();$('msg').after(d);
  d.addEventListener('click',e=>{const a=e.target.closest('a');if(a)a.href=linkNavegador();});}
{const n=String(lsGet(LS_CLI,{}).nombre||'').trim().split(/\s+/)[0];if(n)$('hola').textContent='Hola, '+n.charAt(0).toUpperCase()+n.slice(1).toLowerCase()+'. ¿Qué pedimos hoy?';}
// con el teclado abierto, que el campo no quede tapado
document.addEventListener('focusin',e=>{const i=e.target;if(i.matches&&i.matches('#box input,#box textarea,#box select'))setTimeout(()=>i.scrollIntoView({block:'center',behavior:'smooth'}),300);});
misBtn();load().then(resumeLast);
setInterval(()=>{if(!$('sheet').classList.contains('on'))load();},5*60e3);
// abrir/cerrar a la hora justa sin recargar
let ultimo='';setInterval(()=>{if(!cat.config)return;const k=abierto('asadito')+'|'+abierto('bodega');if(ultimo&&k!==ultimo&&!$('sheet').classList.contains('on'))render();ultimo=k;estadoTabs();},30e3);
</script>
